<style>
  /* Layout: banner inteiro no topo, barra de controle, faixa de números principais e grade de cartões curtos. */
  :root {

  }

    --g1: #a6d977; --g2: #86c255; --g3: #5f9a35; --track: #2a3229;

    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: flex; flex-direction: column; gap: 14px; }

  .funnel .n { font-family: var(--font-title); font-size: 22px; font-weight: 700; color: var(--g1); text-align: right; font-variant-numeric: tabular-nums; }

  .bars { display: flex; flex-direction: column; gap: 7px; }

  .brow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .bt { background: var(--track); border-radius: 6px; height: 10px; overflow: hidden; }
  .brow .bf { height: 100%; border-radius: 6px; background: var(--g2); }
  .brow .bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

  .stages { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) { .stages { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .stage .box b { font-family: var(--font-title); font-size: 24px; line-height: 1; }

  .stage .zero { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); }
  .stage .lbl { font-size: 10px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
  .stage .nm { font-size: 12px; line-height: 1.15; }
  .stage .warn { font-size: 11px; font-weight: 700; color: var(--warn); }

  .human { background: var(--violet); color: var(--violet-ink); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .human .eyebrow { color: var(--violet-ink); opacity: .8; }
  .human .big { color: var(--violet-ink); }
  .human .big small { color: var(--violet-ink); opacity: .75; }
  .human .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .human .kv div { font-size: 12px; opacity: .9; line-height: 1.25; }
  .human .kv b { display: block; font-family: var(--font-title); font-size: 22px; opacity: 1; }

  .meter { position: relative; background: var(--track); border-radius: 8px; height: 14px; }
  .meter .mf { height: 100%; border-radius: 8px; background: var(--g2); }
  .meter .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); }
  .meter-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  .split { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; }
  .split div { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 700; font-size: 12px; border-bottom: 1px solid var(--line); padding: 5px 6px; }
  td { border-bottom: 1px solid var(--line); padding: 5px 6px; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  th.n, td.n { text-align: right; white-space: nowrap; }
  td.heat { text-align: center; font-weight: 700; border-radius: 6px; }

  .alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .alerts li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
  .alerts .num { width: 26px; height: 26px; border-radius: 50%; background: var(--violet-soft); color: var(--violet); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  :root[data-theme="dark"] .alerts .num { color: var(--violet-ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alerts .num { color: var(--violet-ink); } }
  .state { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .state.done { color: var(--ok); border: 1px solid var(--ok); }
  .state.open { color: var(--warn); border: 1px solid var(--warn); }

  .na-block { background: var(--violet-soft); border-radius: 16px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .na-block .eyebrow { color: var(--violet); width: 100%; }
  :root[data-theme="dark"] .na-block .eyebrow { color: var(--violet-ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .na-block .eyebrow { color: var(--violet-ink); } }
  .na-item { font-size: 13px; }
  .na-item b { display: block; font-size: 14px; }
  details { background: var(--card); border-radius: 16px; padding: 12px 18px; }
  summary { cursor: pointer; font-family: var(--font-title); font-weight: 700; font-size: 15px; }
  details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  .xbtn { font: inherit; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--g2); background: transparent; color: var(--g1); cursor: pointer; white-space: nowrap; margin-left: auto; }
  .human .xbtn { border-color: var(--violet-ink); color: var(--violet-ink); }
  .xbtn:hover { background: var(--track); }
  .xbtn:focus-visible { outline: 2px solid var(--g2); outline-offset: 2px; }
  .xbtn[disabled] { opacity: .5; cursor: default; }
  .card h2 small + .xbtn { margin-left: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--card); border-radius: 14px; padding: 4px; align-self: flex-start; }
  .tab { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 10px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--violet); color: var(--violet-ink); }
  .tab:focus-visible { outline: 3px solid var(--g2); outline-offset: 2px; }
  .duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .duo div { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .duo b { display: block; font-family: var(--font-title); font-size: 22px; color: var(--g1); }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 6px; }
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var DADOS = null, atual = null, downloads = null, DET = {};
  var XMAP = [
    ['Do convite à anamnese', ['conversao']], ['Canal de contato humano', ['tempo_resposta', 'postura']], ['Onde estão os pacientes', ['etapas_atual']],
    ['Saídas do funil', ['saidas']], ['Check-ins', ['checkins']], ['Engajamento', ['engajamento']], ['Entrada e cobertura', ['entradas', 'cobertura']],
    ['Resposta ao convite', ['conversao']], ['Efeitos relatados', ['efeitos']], ['Assuntos das conversas', ['assuntos']],
    ['Tempo até a 1ª resposta', ['tempo_resposta']], ['Postura do atendimento', ['postura']]
  ];
  var ABA = { conversao: 'Conversão', tempo_resposta: 'Tempo de resposta', postura: 'Postura', etapas_atual: 'Etapas hoje', saidas: 'Saídas', checkins: 'Check-ins', engajamento: 'Engajamento', entradas: 'Entradas', cobertura: 'Cobertura', efeitos: 'Efeitos relatados', assuntos: 'Assuntos' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var num = function (v, d) { return v == null ? '–' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); };
  var pct = function (v) { return v == null ? '–' : num(v, 1) + '%'; };
  var dataBR = function (s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var abrev = function (k) { return MESES[Number(k.slice(5, 7)) - 1] + '/' + k.slice(2, 4); };
  var chaves = function () { return Object.keys(DADOS.meses).sort(); };
  var chavesMes = chaves;
  var anterior = function (k) { var m = chaves(), i = m.indexOf(k); return i > 0 ? m[i - 1] : null; };

  var semComparacao = false;
  function delta(v, ant, tipo, kAnt) {
    if (v == null || semComparacao) return '';
    if (ant == null) return '<span class="chip">' + (kAnt ? abrev(kAnt) + ': não apurado' : 'Linha de base') + '</span>';
    var d = v - ant, s = d > 0 ? '+' : d < 0 ? '−' : '';
    var txt = tipo === 'pp' ? s + num(Math.abs(d), 1) + ' p.p.' : s + num(Math.abs(d));
    return '<span class="chip ' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '" title="' + abrev(kAnt) + ': ' + (tipo === 'pp' ? pct(ant) : num(ant)) + '">' + txt + ' vs ' + abrev(kAnt) + '</span>';
  }
  function meta(v, m) { if (v == null) return ''; return '<span class="chip ' + (v >= m ? 'meta-ok' : 'meta-no') + '">Meta ' + m + '% ' + (v >= m ? '✓' : '✗') + '</span>'; }
  function kpi(v, rot, chips) { return '<div class="kpi">' + (v == null ? '<div class="v na">não apurado</div>' : '<div class="v">' + v + '</div>') + '<div class="l">' + rot + '</div><div class="chips">' + (chips || '') + '</div></div>'; }
  function barras(itens, max) {
    max = max || Math.max.apply(null, itens.map(function (x) { return x[1]; }).concat([1]));
    return '<div class="bars">' + itens.map(function (x) { return '<div class="brow" title="' + esc(x[0]) + ': ' + num(x[1]) + '"><span class="t">' + esc(x[0]) + '</span><span class="bt"><span class="bf" style="display:block;width:' + (100 * x[1] / max) + '%"></span></span><span class="bv">' + (x[2] || num(x[1])) + '</span></div>'; }).join('') + '</div>';
  }
  function etapas(arr, parados) {
    var nomes = ['Convite', 'Anamnese', 'Check-in mensal', '1º formulário', 'Celebração', 'Bimestral inicial', '2º formulário', 'Bimestral geral'];
    var cores = ['var(--g1)', 'var(--g2)', 'var(--g3)'];
    return '<div class="stages">' + arr.map(function (n, i) {
      var box = n > 0 ? '<div class="box" style="background:' + (cores[i] || 'var(--g3)') + '"><b>' + num(n) + '</b><span>pacientes</span></div>' : '<div class="box zero"><b>0</b></div>';
      var p = parados && parados[i] ? '<div class="warn">' + parados[i] + ' parados</div>' : '';
      return '<div class="stage">' + box + '<div class="lbl">ETAPA ' + (i + 1) + '</div><div class="nm">' + nomes[i] + '</div>' + p + '</div>';
    }).join('') + '</div>';
  }
  function funil(conv, aceit, anam, extraCap, pAceite, pAnam) {
    var linha = function (n, w, cor, rot, p) { return '<div class="n">' + num(n) + '</div><div class="track"><div class="fill" style="width:' + w + '%;background:' + cor + '">' + rot + '</div></div><div class="p">' + (p || '') + '</div>'; };
    return '<div class="funnel">' + linha(conv, 100, 'var(--g1)', 'convidados', '') + linha(aceit, 100 * aceit / conv, 'var(--g2)', 'aceitaram', pct(pAceite != null ? pAceite : 100 * aceit / conv)) + linha(anam, 100 * anam / conv, 'var(--g3)', 'anamnese', pct(pAnam != null ? pAnam : 100 * anam / aceit)) + '</div>' + (extraCap ? '<p class="cap">' + extraCap + '</p>' : '');
  }
  function serie() {
    var ks = chaves();
    var lin = function (rot, f, fmt) { return '<tr><td>' + rot + '</td>' + ks.map(function (k) { var v = f(DADOS.meses[k]); return '<td class="n">' + (v == null ? '<span class="empty">–</span>' : fmt(v)) + '</td>'; }).join('') + '</tr>'; };
    return '<div class="card"><h2>Série histórica <small>setembro é parcial (retomada em 09/09)</small></h2><div class="tablewrap"><table><tr><th>Indicador</th>' + ks.map(function (k) { return '<th class="n">' + abrev(k) + '</th>'; }).join('') + '</tr>' +
      lin('Novos convidados', function (m) { return m.principais.entradas_novos != null ? m.principais.entradas_novos : m.principais.convites_novos; }, num) +
      lin('Aceite do convite', function (m) { return m.principais.aceite_pct; }, pct) +

    if (novo === 'prog') {
      if (!DADOS) return;
      var ks = chaves().filter(function (k) { return k >= (DADOS.inicio_serie || '0000'); });
      $('mes').innerHTML = '<option value="total">Desde o início</option>' + ks.slice().reverse().map(function (k) { return '<option value="' + k + '">' + esc(DADOS.meses[k].rotulo) + '</option>'; }).join('');
      selecionar(atual || ks[ks.length - 1]);
      return;
    }
    var abrir = function () {
      var ks = clinKs();
      $('mes').innerHTML = ['total'].concat(ks.slice().reverse()).map(function (k) { return '<option value="' + k + '">' + rotuloClin(k) + '</option>'; }).join('');
      var salvo = null; try { salvo = localStorage.getItem('cc-mes-clin'); } catch (e) {}
      var ultFechado = ks.filter(function (x) { return x < CLIN.fonte_atualizada.slice(0, 7); }).pop() || ks[ks.length - 1];
      selecionarClin(atualClin || (salvo && (salvo === 'total' || CLIN.meses[salvo]) ? salvo : ultFechado));
    };
    if (CLIN) return abrir();
    $('conteudo').innerHTML = '<div class="card empty">Carregando os indicadores clínicos.</div>';
    fetch('dados/clinico_anamnese.json').then(function (r) { return r.json(); }).then(function (j) { CLIN = j; if (modo === 'clin') abrir(); })
      .catch(function () { $('conteudo').innerHTML = '<div class="card empty">Não foi possível carregar os indicadores clínicos. Recarregue a página.</div>'; });
  }

  $('pdf-exec').addEventListener('click', function () { baixar('executivo'); });
  $('pdf-comp').addEventListener('click', function () { baixar('completo'); });
  $('mes').addEventListener('change', function () { if (modo === 'clin') selecionarClin(this.value); else selecionar(this.value); });
  $('tab-prog').addEventListener('click', function () { if (modo !== 'prog') trocar('prog'); });
  $('tab-clin').addEventListener('click', function () { if (modo !== 'clin') trocar('clin'); });

  var painelSalvo = null; try { painelSalvo = localStorage.getItem('cc-painel'); } catch (e) {}
  fetch('dados/historico_mensal.json').then(function (r) { return r.json(); }).then(function (j) {
    DADOS = j;
    var ks = chaves().filter(function (k) { return k >= (j.inicio_serie || '0000'); });
    var salvo = null; try { salvo = localStorage.getItem('cc-mes'); } catch (e) {}
    atual = salvo && (salvo === 'total' || j.meses[salvo]) ? salvo : ks[ks.length - 1];
    if (modo === 'prog') trocar('prog');
  }).catch(function () { if (modo === 'prog') $('conteudo').innerHTML = '<div class="card empty">Não foi possível carregar os dados. Recarregue a página.</div>'; });
  if (painelSalvo === 'clin') trocar('clin');

  if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloads = d; if (atual && modo === 'prog' && DADOS) selecionar(atual); }).catch(function () {});
})();
</script>
